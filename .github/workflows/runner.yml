name: Dziennik Biegowy Bot

on:
  schedule:
    - cron: "*/5 * * * *"      # nasłuch Telegrama (każdy przebieg ~4 min)
    - cron: "0 5,6 * * *"      # poranek 07:00 czasu PL (lato=5 UTC, zima=6 UTC)
    - cron: "30 19,20 * * *"   # wieczór 21:30 czasu PL (lato=19:30 UTC, zima=20:30 UTC)
    - cron: "0 6,7 1 * *"      # raport 1. dnia miesiąca, 08:00 czasu PL
  workflow_dispatch:
    inputs:
      mode:
        description: "Tryb"
        type: choice
        default: poll
        options: [poll, morning, evening, monthly, setup, test-garmin]

# osobna kolejka dla każdego trybu; poll nigdy nie działa równolegle sam ze sobą
concurrency:
  group: bot-${{ (github.event.schedule == '*/5 * * * *' || inputs.mode == 'poll' || (github.event_name == 'workflow_dispatch' && inputs.mode == '')) && 'poll' || github.event.schedule || inputs.mode }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Ustal tryb
        id: m
        env:
          SCHEDULE: ${{ github.event.schedule }}
          INPUT_MODE: ${{ inputs.mode }}
        run: |
          case "$SCHEDULE" in
            "*/5 * * * *")     echo "args=poll" >> "$GITHUB_OUTPUT" ;;
            "0 5,6 * * *")     echo "args=morning --at 07:00" >> "$GITHUB_OUTPUT" ;;
            "30 19,20 * * *")  echo "args=evening --at 21:30" >> "$GITHUB_OUTPUT" ;;
            "0 6,7 1 * *")     echo "args=monthly --at 08:00 --day 1" >> "$GITHUB_OUTPUT" ;;
            *)                 echo "args=${INPUT_MODE:-poll}" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Uruchom bota
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_CREDS_JSON: ${{ secrets.GOOGLE_CREDS_JSON }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
          GARMIN_EMAIL: ${{ secrets.GARMIN_EMAIL }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
        run: python bot_runner.py ${{ steps.m.outputs.args }}
